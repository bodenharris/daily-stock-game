name: Ship a release
description: >
  Copy the built app to a slot on the server, switch to it, and roll back if it isn't healthy.
  Expects `npm run build` to have run, and SSH set up by the setup-ssh action.

inputs:
  slot:
    description: prod or preview
    required: true
  port:
    description: The port the slot's app listens on (prod 3000, preview 3001)
    required: true

outputs:
  release:
    description: The release id that was shipped
    value: ${{ steps.ship.outputs.release }}

runs:
  using: composite
  steps:
    - id: ship
      shell: bash
      env:
        SLOT: ${{ inputs.slot }}
        PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        release="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
        dir="/srv/hindsight/$SLOT/releases/$release"
        # The build is self-contained (every dependency is bundled), so a release is just
        # build/, package.json (for "type": "module") and the switch script.
        tar czf release.tgz build package.json deploy/release.sh
        ssh deploy-host "mkdir -p '$dir' && tar xzf - -C '$dir'" < release.tgz
        ssh deploy-host "bash '$dir/deploy/release.sh' '$SLOT' '$release' '$PORT'"
        echo "release=$release" >> "$GITHUB_OUTPUT"
