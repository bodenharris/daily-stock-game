name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, so two pushes never run migrations against each other.
concurrency:
  group: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    # DATABASE_URL is a secret of the production environment.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Formatting, linting, types and unit tests. A failure stops here, before the migration and the deploy.
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action uses the wrangler that `npm ci` installed (pinned in package.json).
          command: deploy
