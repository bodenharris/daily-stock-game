name: PR

# For pull requests from branches in this repo (PRs from forks never get these secrets).
#
# With PREVIEW_ENABLED = 'true': fork the production database, run this PR's migrations on
# the fork, deploy the PR to the single preview site on that fork, smoke-test it, and comment
# the link on the PR. The newest push wins the preview; the fork it replaces is deleted.
#
# Otherwise, with TIGER_SERVICE_ID set: the same database check without a preview. Fork,
# migrate, start the app in CI and smoke-test it, then delete the fork.
#
# Run it by hand (Actions > PR > Run workflow) to put any open PR back on the preview.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the PR to put on the preview
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
  # Build-time placeholders, never baked into the build (see ci.yml).
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  BETTER_AUTH_SECRET: ci-placeholder-not-a-secret-0123456789abcdef
  ORIGIN: http://localhost:3000

jobs:
  database:
    name: Migrations and smoke test on a database fork
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.TIGER_SERVICE_ID != '' && vars.PREVIEW_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-database-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Fork the production database
        id: fork
        uses: timescale/fork-service@37e52d9689d83cf6521395711c71d41c396f28b3 # v1.0.0
        with:
          project_id: ${{ vars.TIGER_PROJECT_ID }}
          service_id: ${{ vars.TIGER_SERVICE_ID }}
          api_key: ${{ secrets.TIGERDATA_API_KEY }}
          fork_strategy: last-snapshot
          name: ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          cleanup: true

      - name: Point at the fork
        env:
          PASSWORD: ${{ steps.fork.outputs.initial_password }}
          HOST: ${{ steps.fork.outputs.host }}
          PORT: ${{ steps.fork.outputs.port }}
          DB_USER: ${{ vars.TIGER_DB_USER || 'tsdbadmin' }}
          DB_NAME: ${{ vars.TIGER_DB_NAME || 'tsdb' }}
        run: |
          url="postgres://$DB_USER:$PASSWORD@$HOST:$PORT/$DB_NAME?sslmode=require"
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Run this PR's migrations on the fork
        run: npm run db:migrate

      - name: Start the app on the fork
        run: |
          export PORT=3000 HOST=127.0.0.1 PLAY_SOURCE=dev
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          nohup node build > app.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: Smoke test (pages load, nothing spoiled)
        run: node scripts/smoke.ts http://127.0.0.1:3000

  preview:
    name: Deploy the preview
    if: >-
      vars.PREVIEW_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ vars.PREVIEW_URL }}
    # One preview at a time: a newer push replaces a deploy still in progress.
    concurrency:
      group: preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          # The PR's own commit, not GitHub's merge preview.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - uses: ./.github/actions/setup-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER || 'deploy' }}
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Find the fork the preview uses now
        id: old
        run: |
          id="$(ssh deploy-host 'cat /srv/hindsight/preview/shared/service-id 2>/dev/null || true')"
          echo "service_id=$id" >> "$GITHUB_OUTPUT"

      - name: Fork the production database
        id: fork
        uses: timescale/fork-service@37e52d9689d83cf6521395711c71d41c396f28b3 # v1.0.0
        with:
          project_id: ${{ vars.TIGER_PROJECT_ID }}
          service_id: ${{ vars.TIGER_SERVICE_ID }}
          api_key: ${{ secrets.TIGERDATA_API_KEY }}
          fork_strategy: last-snapshot
          name: preview-pr-${{ env.PR_NUMBER }}-${{ github.run_id }}
          cleanup: false

      - name: Point at the fork
        env:
          PASSWORD: ${{ steps.fork.outputs.initial_password }}
          HOST: ${{ steps.fork.outputs.host }}
          PORT: ${{ steps.fork.outputs.port }}
          DB_USER: ${{ vars.TIGER_DB_USER || 'tsdbadmin' }}
          DB_NAME: ${{ vars.TIGER_DB_NAME || 'tsdb' }}
        run: |
          url="postgres://$DB_USER:$PASSWORD@$HOST:$PORT/$DB_NAME?sslmode=require"
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Run this PR's migrations on the fork
        run: npm run db:migrate

      # The preview's own settings live in /etc/hindsight/preview.env; only the database
      # changes per deploy, so it goes in a file the deploy user owns.
      - name: Give the preview its new database
        id: record
        env:
          NEW_ID: ${{ steps.fork.outputs.service_id }}
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" | ssh deploy-host \
            'set -e; mkdir -p /srv/hindsight/preview/shared; cd /srv/hindsight/preview/shared;
             umask 077; cat > runtime.env.next; mv runtime.env.next runtime.env'
          printf '%s\n' "$NEW_ID" | ssh deploy-host 'cat > /srv/hindsight/preview/shared/service-id'

      - name: Ship, switch and health-check
        uses: ./.github/actions/ship
        with:
          slot: preview
          port: '3001'

      - name: Smoke test the preview
        env:
          URL: ${{ vars.PREVIEW_URL }}
        run: node scripts/smoke.ts "$URL"

      - name: Comment the preview link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ vars.PREVIEW_URL }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview: $URL (commit ${SHA::7}), on a fresh fork of the production database. The next push to any PR replaces it."

      # Delete the fork this deploy replaced. If the deploy stopped before the preview switched
      # to the new fork, delete the new one instead, so nothing is left running and billed.
      - name: Clean up forks
        if: always()
        env:
          API_KEY: ${{ secrets.TIGERDATA_API_KEY }}
          OLD_ID: ${{ steps.old.outputs.service_id }}
          NEW_ID: ${{ steps.fork.outputs.service_id }}
          SWITCHED: ${{ steps.record.outcome == 'success' }}
          PROD_ID: ${{ vars.TIGER_SERVICE_ID }}
        run: |
          if [ "$SWITCHED" = "true" ]; then target="$OLD_ID"; else target="$NEW_ID"; fi
          # Never the production service itself.
          if [ -z "$target" ] || [ "$target" = "$PROD_ID" ]; then exit 0; fi
          curl -s https://packagecloud.io/install/repositories/timescale/tiger-cli/script.deb.sh \
            | sudo os=any dist=any bash > /dev/null
          sudo apt-get install -y -qq tiger-cli > /dev/null
          export TIGER_PUBLIC_KEY="${API_KEY%%:*}" TIGER_SECRET_KEY="${API_KEY#*:}"
          tiger service delete "$target" --confirm || echo "::warning::Could not delete fork $target; delete it in the Tiger console."
