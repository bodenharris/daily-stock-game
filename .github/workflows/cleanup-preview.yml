name: Clean up preview

# When a pull request closes, delete its Workers Preview and its Neon branch.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# Wait for a deploy of the same pull request that is still running, so it cannot recreate what this deletes.
concurrency:
  group: preview-${{ github.event.number }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview delete --name pr-${{ github.event.number }} --skip-confirmation
      - uses: neondatabase/delete-branch-action@v3
        # Even when there was no Preview to delete.
        if: always()
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: pr-${{ github.event.number }}
