<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- Dark mode follows the system: CSS media queries only, so there is no flash on load. -->
		<meta name="color-scheme" content="light dark" />
		<!-- M3 surface (light / dark) from src/routes/layout.css -->
		<meta name="theme-color" content="#f7fbf2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#101510" media="(prefers-color-scheme: dark)" />
		<link
			rel="preload"
			href="/fonts/google-sans-flex-latin-rond-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/roboto-flex-latin-opsz-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
